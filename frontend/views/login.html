<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Student Performance Analytics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Animated Background -->
  <div class="analytics-bg" id="analytics-bg"></div>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Logo -->
      <div class="auth-logo">
        <div class="logo-icon">🎓</div>
        <h1>Student Performance<br>ANALYTICS</h1>
        <p>Academic Intelligence Platform</p>
      </div>

      <h2 class="auth-title">Welcome Back</h2>
      <p class="auth-subtitle">Sign in to access your analytics dashboard</p>

      <!-- Alerts -->
      <div class="alert-custom alert-error" id="error-alert"></div>
      <div class="alert-custom alert-success" id="success-alert"></div>

      <!-- Login Form -->
      <form id="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="your@college.edu"
            autocomplete="email"
            required
          />
          <div class="invalid-feedback" id="email-error" style="display:none;"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
          <div class="invalid-feedback" id="password-error" style="display:none;"></div>
        </div>

        <button type="submit" class="btn-primary-custom" id="submit-btn">
          Sign In →
        </button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="/signup">Create Account</a>
      </div>

      <!-- Demo credentials hint -->
      <!-- <div style="margin-top:20px; padding:12px 16px; background:rgba(0,212,255,0.05); border:1px solid rgba(0,212,255,0.15); border-radius:8px; font-size:12px; color:var(--text-muted); text-align:center;">
        💡 <strong style="color:var(--text-secondary);">Demo Admin:</strong> admin@college.edu / admin123
      </div> -->
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script>
    // Create particles
    createParticles(25);

    // Check if already logged in
    API.get('/auth/me').then(data => {
      if (data.success) {
        if (data.user.role === 'Admin') {
          window.location.href = '/admin';
        } else {
          window.location.href = '/loading';
        }
      }
    }).catch(() => {});

    // Form submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Basic client validation
      let valid = true;
      if (!email || !/\S+@\S+\.\S+/.test(email)) {
        showFieldError('email-error', 'Please enter a valid email address.');
        valid = false;
      }
      if (!password) {
        showFieldError('password-error', 'Password is required.');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Signing In...';

      try {
        const data = await API.post('/auth/login', { email, password });

        if (data.success) {
          showAlert('success-alert', '✅ ' + data.message);
          setTimeout(() => {
            if (data.user.role === 'Admin') {
              window.location.href = '/admin';
            } else {
              window.location.href = '/loading';
            }
          }, 800);
        } else {
          const msg = data.errors ? data.errors[0].msg : data.message;
          showAlert('error-alert', '❌ ' + msg);
          btn.disabled = false;
          btn.textContent = 'Sign In →';
        }
      } catch (err) {
        showAlert('error-alert', '❌ Connection error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Sign In →';
      }
    });

    function showAlert(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function showFieldError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }

    function clearErrors() {
      ['email-error', 'password-error'].forEach(id => {
        const el = document.getElementById(id);
        el.textContent = '';
        el.style.display = 'none';
      });
      ['error-alert', 'success-alert'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });
    }
  </script>
</body>
</html>
